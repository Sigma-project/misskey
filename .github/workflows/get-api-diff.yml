# this name is used in report-api-diff.yml so be careful when change name
name: Get api.json from Misskey

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - .github/workflows/get-api-diff.yml
jobs:
  get-from-misskey:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        api-json-name: [api-base.json, api-head.json]
        include:
          - api-json-name: api-base.json
            ref: ${{ github.base_ref }}
          - api-json-name: api-head.json
            ref: refs/pull/${{ github.event.number }}/merge

    steps:
    - uses: actions/checkout@v6.0.1
      with:
        ref: ${{ matrix.ref }}
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.2.0
    - name: Install libvips dependencies
      if: hashFiles('mise.toml') != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglib2.0-dev libexpat1-dev libjpeg-turbo8-dev libpng-dev libwebp-dev \
          libtiff-dev libexif-dev liblcms2-dev libcgif-dev libjxl-dev libheif-dev \
          libfftw3-dev liborc-dev libspng-dev libarchive-dev libhwy-dev librsvg2-dev
    - name: Restore libvips cache
      id: cache-libvips
      if: hashFiles('mise.toml') != ''
      uses: actions/cache@v4
      with:
        path: /tmp/libvips-destdir
        key: libvips-v4-8.18.0-${{ runner.os }}-${{ runner.arch }}
    - name: Build libvips from source
      if: hashFiles('mise.toml') != '' && steps.cache-libvips.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install -y build-essential ninja-build meson pkg-config
        cd /tmp
        curl -sL https://github.com/libvips/libvips/releases/download/v8.18.0/vips-8.18.0.tar.xz -o vips.tar.xz
        tar xf vips.tar.xz
        cd vips-8.18.0
        meson setup build --prefix=/usr/local --libdir=lib --buildtype=release -Dintrospection=disabled -Djpeg-xl=enabled
        cd build
        meson compile
        DESTDIR=/tmp/libvips-destdir meson install
    - name: Install libvips
      if: hashFiles('mise.toml') != ''
      run: |
        sudo cp -a /tmp/libvips-destdir/usr/local/. /usr/local/
        sudo ldconfig
        pkg-config --modversion vips-cpp
    - name: Setup mise
      if: hashFiles('mise.toml') != ''
      uses: jdx/mise-action@v2
    - name: Use Node.js (fallback)
      if: hashFiles('mise.toml') == ''
      uses: actions/setup-node@v6.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Copy Configure
      run: cp .config/example.yml .config/default.yml
    - name: Build
      run: |
        if [ -f mise.toml ]; then
          mise run build
        else
          pnpm i --frozen-lockfile
          pnpm build
        fi
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Generate API JSON
      run: pnpm --filter backend generate-api-json
    - name: Copy API.json
      run: cp packages/backend/built/api.json ${{ matrix.api-json-name }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: api-artifact-${{ matrix.api-json-name }}
        path: ${{ matrix.api-json-name }}

  save-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "$PR_NUMBER" > ./pr_number
      - uses: actions/upload-artifact@v6
        with:
          name: api-artifact-pr-number
          path: pr_number
