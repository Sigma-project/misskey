name: misskey-test
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "54312:5432"
    environment:
      POSTGRES_DB: test-misskey
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U postgres"
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56312:6379"
    tmpfs:
      - /data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20
