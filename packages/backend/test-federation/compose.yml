include:
  - ./compose.a.yml
  - ./compose.b.yml

services:
  setup:
    extends:
      file: ./compose.tpl.yml
      service: misskey
    command: >
      bash -ec "
        npm install -g pnpm
        pnpm -F backend i
        pnpm -F misskey-js i
        pnpm -F misskey-reversi i
      "

  tester:
    image: node:${NODE_VERSION}
    depends_on:
      daemon:
        condition: service_healthy
      a.test:
        condition: service_healthy
      misskey.a.test:
        condition: service_healthy
      b.test:
        condition: service_healthy
      misskey.b.test:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/rootCA.crt
    volumes:
      - type: bind
        source: ../../../scripts/build-sharp.mjs
        target: /misskey/scripts/build-sharp.mjs
        read_only: true
      - type: bind
        source: ../package.json
        target: /misskey/packages/backend/package.json
        read_only: true
      - type: bind
        source: ../test/resources
        target: /misskey/packages/backend/test/resources
        read_only: true
      - type: bind
        source: ./test
        target: /misskey/packages/backend/test-federation/test
        read_only: true
      - type: bind
        source: ../vitest.config.ts
        target: /misskey/packages/backend/vitest.config.ts
        read_only: true
      - type: bind
        source: ../vitest.config.fed.ts
        target: /misskey/packages/backend/vitest.config.fed.ts
        read_only: true
      - type: bind
        source: ../scripts/compile_config.js
        target: /misskey/packages/backend/scripts/compile_config.js
        read_only: true
      - type: bind
        source: ../../misskey-js/built
        target: /misskey/packages/misskey-js/built
        read_only: true
      - type: bind
        source: ../../misskey-js/package.json
        target: /misskey/packages/misskey-js/package.json
        read_only: true
      - type: bind
        source: ../../i18n/built
        target: /misskey/packages/i18n/built
        read_only: true
      - type: bind
        source: ../../i18n/package.json
        target: /misskey/packages/i18n/package.json
        read_only: true
      - type: bind
        source: ../../../package.json
        target: /misskey/package.json
        read_only: true
      - type: bind
        source: ../../../pnpm-lock.yaml
        target: /misskey/pnpm-lock.yaml
        read_only: true
      - type: bind
        source: ../../../pnpm-workspace.yaml
        target: /misskey/pnpm-workspace.yaml
        read_only: true
      - type: bind
        source: ../../../patches
        target: /misskey/patches
        read_only: true
      - type: bind
        source: ./certificates/rootCA.crt
        target: /usr/local/share/ca-certificates/rootCA.crt
        read_only: true
      - type: bind
        source: ../../misskey-reversi/package.json
        target: /misskey/packages/misskey-reversi/package.json
        read_only: true
      - type: bind
        source: ../../misskey-reversi/built
        target: /misskey/packages/misskey-reversi/built
        read_only: true
    working_dir: /misskey
    entrypoint: >
      bash -ec '
        npm install -g pnpm
        pnpm -F misskey-js i --frozen-lockfile
        pnpm -F backend i --frozen-lockfile
        exec "$0" "$@"
      '
    command: pnpm -F backend test:fed

  daemon:
    image: node:${NODE_VERSION}
    depends_on:
      redis.test:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../../../scripts/build-sharp.mjs
        target: /misskey/scripts/build-sharp.mjs
        read_only: true
      - type: bind
        source: ../package.json
        target: /misskey/packages/backend/package.json
        read_only: true
      - type: bind
        source: ./daemon.ts
        target: /misskey/packages/backend/test-federation/daemon.ts
        read_only: true
      - type: bind
        source: ./tsconfig.json
        target: /misskey/packages/backend/test-federation/tsconfig.json
        read_only: true
      - type: bind
        source: ../../../package.json
        target: /misskey/package.json
        read_only: true
      - type: bind
        source: ../../../pnpm-lock.yaml
        target: /misskey/pnpm-lock.yaml
        read_only: true
      - type: bind
        source: ../../../pnpm-workspace.yaml
        target: /misskey/pnpm-workspace.yaml
        read_only: true
      - type: bind
        source: ../../../patches
        target: /misskey/patches
        read_only: true
      - type: bind
        source: ../../i18n/package.json
        target: /misskey/packages/i18n/package.json
        read_only: true
      - type: bind
        source: ../../misskey-js/package.json
        target: /misskey/packages/misskey-js/package.json
        read_only: true
      - type: bind
        source: ../../misskey-reversi/package.json
        target: /misskey/packages/misskey-reversi/package.json
        read_only: true
    working_dir: /misskey
    command: >
      bash -ec "
        npm install -g pnpm
        pnpm -F backend i --frozen-lockfile
        pnpm exec tsc -p ./packages/backend/test-federation
        exec node ./packages/backend/test-federation/built/daemon.js
      "

    healthcheck:
      test: ["CMD", "node", "-e", "const a = require('node:fs').readFileSync('/proc/1/cmdline', 'utf8').split(String.fromCharCode(0)); process.exit(require('node:path').basename(a[0]) === 'node' && a[1] === './packages/backend/test-federation/built/daemon.js' ? 0 : 1)"]
      interval: 5s
      retries: 60

  redis.test:
    image: redis:7-alpine
    volumes:
      - type: bind
        source: ./volumes/redis
        target: /data
        bind:
          create_host_path: true
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 20
